# An unsigned .ipa of Wolkara's runtime from this fork, for sideloading and
# testing. Unlike release.yml it keeps the runner's public root certificates
# (TOLKARA_SYSTEM_ROOTS=YES), which WoW needs to log in. The artifact is for
# your own device, not for publishing.

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [wolkara-external-jit]

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned .ipa with root certificates (${{ matrix.runner }})
    # Hosted arm64 Macs are often short ("capacity constraints"); the Intel
    # image carries the same Xcode and cross-builds the same arm64 app. Both
    # run, and either artifact installs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            suffix: ""
          - runner: macos-26-intel
            suffix: "-intel-runner"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the unsigned .ipa
        run: TOLKARA_SYSTEM_ROOTS=YES tools/package_ipa.sh Tolkara-unsigned.ipa

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs${{ matrix.suffix }}
          path: logs/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Wolkara-unsigned-ipa${{ matrix.suffix }}
          path: Tolkara-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
