name: Tolkara
options:
  bundleIdPrefix: local.tolkara
  deploymentTarget: { iOS: "17.0" }
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    revision: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d
settings:
  base:
    # Signing identity and identifiers come from your ignored local.env through
    # tools/generate.sh. Nothing personal is committed. See docs/BUILDING.md.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TOLKARA_BUNDLE_ID: ${TOLKARA_BUNDLE_ID}
    TOLKARA_KEYCHAIN_GROUP: ${TOLKARA_KEYCHAIN_GROUP}
    # Optional execution-mode preselection (developer-service or local-signing;
    # tools/package_ipa.sh passes external-jit), read once into Info.plist.
    # Normal Wolkara launches use the route included in the target.
    TOLKARA_MODE: ${TOLKARA_MODE}
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_OBJC_ARC: YES
    GUEST_RUNTIME: emulated
    HEADER_SEARCH_PATHS: "$(SRCROOT)/runtime $(SRCROOT)/translation/Metal"
schemes:
  # tools/package_ipa.sh builds this scheme: a target-only build skips
  # Swift package resource bundles (ZIPFoundation_ZIPFoundation.bundle).
  TolkaraDiagnostics:
    build:
      targets:
        TolkaraDiagnostics: all
    management:
      shared: true
  WolkaraExternalJIT:
    build:
      targets:
        WolkaraExternalJIT: all
    run:
      config: Debug
      executable: WolkaraExternalJIT
      debugEnabled: false
      enableGPUValidationMode: false
    management:
      shared: true
      isShown: true
  Tolkara:
    build:
      targets:
        Tolkara: all
    run:
      config: Debug
      executable: Tolkara
      # Guest execution must not keep Xcode's debugger attached.
      debugEnabled: false
      # Xcode's Metal debug device can forward macOS-only selectors past the
      # adapter to the iOS driver. Match an ordinary Home Screen launch.
      enableGPUValidationMode: false
    management:
      shared: true
      isShown: true
      orderHint: 0
targetTemplates:
  MemoryCapabilities:
    entitlements:
      path: launcher/App.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
  AppBase:
    type: application
    platform: iOS
    dependencies:
      - sdk: libz.tbd
      - sdk: Security.framework
      - sdk: Speech.framework
      - sdk: AVFAudio.framework
      - package: ZIPFoundation
    sources:
      - path: launcher
        excludes: [Info.plist]
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: WolkaraForever-LICENSE
        buildPhase: resources
      - path: ZIPFoundation-LICENSE
        buildPhase: resources
      - path: runtime
      # The shader-container rewrap, for the Diagnostics menu's captured-shader check.
      - path: translation/Metal/LibraryContainer.m
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID)
        # Include compatibility libraries when building directly from Xcode.
        NATIVE_GUEST_SHIMS: GENERIC
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Wolkara
        INFOPLIST_KEY_CFBundleDisplayName: ${TOLKARA_DISPLAY_NAME}
        INFOPLIST_FILE: launcher/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use the microphone for voice chat or to dictate a draft that you review before sending."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribe your voice into a visible draft. Text is sent only when you confirm."
    postBuildScripts:
      - name: Package guest runtime
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "$GUEST_RUNTIME" != emulated ]; then echo "error: unknown GUEST_RUNTIME: $GUEST_RUNTIME"; exit 1; fi
          "$SRCROOT/tools/build_emulated_guest.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$GUEST_EXE"
targets:
  WolkaraExternalJIT:
    templates: [AppBase]
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).externaljit
        INFOPLIST_KEY_CFBundleDisplayName: Wolkara JIT
        TOLKARA_MODE: external-jit
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) TOLKARA_EXTERNAL_JIT_PROTOTYPE=1"
        CODE_SIGN_ENTITLEMENTS: launcher/ExternalJIT.entitlements
  TolkaraDiagnostics:
    templates: [AppBase, MemoryCapabilities]
  Tolkara:
    templates: [AppBase]
    sources: [authorization/App, authorization/Diagnostics, authorization/Control, authorization/Storage, authorization/Pairing/PairingWire.swift, authorization/Pairing/PairingIdentity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID)
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) TOLKARA_INTEGRATED_AUTH=1"
        INFOPLIST_FILE: authorization/App/Integrated-Info.plist
        SWIFT_VERSION: "5.0"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/authorization $(SRCROOT)/authorization/App"
    entitlements:
      path: authorization/App/Integrated.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP)"]
    dependencies:
      - sdk: NetworkExtension.framework
      - target: LocalAuthorizationTunnel
        embed: true
  LocalAuthorizationTunnel:
    type: app-extension
    platform: iOS
    sources: [authorization/Tunnel, authorization/Diagnostics, authorization/Control, authorization/LocalRoute.c, authorization/DebugWire.c, authorization/Pairing, authorization/Transport, authorization/Storage, authorization/Debugger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).authorization
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: authorization/Tunnel/Info.plist
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/authorization"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        # The helper processes every byte of the local TCP/TLS and RSP streams.
        # Keep this path optimized even in a development-signed diagnostic app.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        GCC_OPTIMIZATION_LEVEL: "2"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/authorization/Transport/TransportBridge.h"
    entitlements:
      path: authorization/Tunnel/LocalTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP)"]
    dependencies:
      - sdk: NetworkExtension.framework

  StorageProbe:
    type: application
    platform: iOS
    sources: [tools/StorageProbe, authorization/Storage, authorization/Pairing/PairingWire.swift, authorization/Pairing/PairingIdentity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).storageprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: tools/StorageProbe/Info.plist
        STORAGE_PROBE_GROUP: "$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP).probe"
        SWIFT_VERSION: "5.0"
    entitlements:
      path: tools/StorageProbe/Probe.entitlements
      properties:
        keychain-access-groups: ["$(STORAGE_PROBE_GROUP)"]
    dependencies:
      - sdk: Security.framework
